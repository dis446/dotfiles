# zram swap for the build/dev box. Canonical copy; fedora/install.sh installs it
# to /etc/systemd/zram-generator.conf (copied, not symlinked -- the generator
# runs early in boot, before a $HOME symlink target is guaranteed readable).
#
# Fedora's stock config is `zram-size = min(ram, 8192)` with the kernel's default
# algorithm (lzo-rle): a fixed 8 GiB that does not scale, compressed with the
# weakest coder. Under a dozen concurrent JVM/Node builds that is the worst
# combination -- hence half of RAM, capped at 32 GiB, with zstd.
#
# Half of RAM, capped at 32 GiB: 8 GiB on a 16 GiB box today, 32 GiB once a
# RAM upgrade lands. zstd because build spill is text, bytecode and page cache,
# not incompressible media.
[zram0]
zram-size = min(ram / 2, 32768)
compression-algorithm = zstd
