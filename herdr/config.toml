onboarding = false

[keys]
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

# Show pi-subagents async-run state (busy/blocked metadata) in the Agent sidebar.
agent_panel_sort = "spaces"
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

# alt+k: toggle the pi agent pane (see herdr/pi-toggle.sh).
# Pure focus toggle, works from any pane: focuses the workspace's "pi" tab
# (creating it + spawning pi on first use), toggles back to the main tab.
[[keys.command]]
key = "alt+k"
type = "shell"
command = "$HOME/dotfiles/herdr/pi-toggle.sh"
description = "toggle pi panel"

# alt+i: toggle the workspace terminal pane (see herdr/term-toggle.sh).
# One terminal per workspace, parked in its own "term" tab.
[[keys.command]]
key = "alt+i"
type = "shell"
command = "$HOME/dotfiles/herdr/term-toggle.sh"
description = "toggle terminal pane"

# alt+g: toggle the workspace GitLab TUI pane (see herdr/gitlab-toggle.sh).
# One gitlab-tui (vim-key GitLab browser) per workspace, in its own "gitlab" tab.
[[keys.command]]
key = "alt+g"
type = "shell"
command = "$HOME/dotfiles/herdr/gitlab-toggle.sh"
description = "toggle gitlab pane"

# alt+r: ensure every workspace has its trio (nvim + pi + term + gitlab).
# Run after attaching if the boot-time restore missed the workspaces
# (headless server restores session.json only once a client attaches).
[[keys.command]]
key = "alt+r"
type = "shell"
command = "$HOME/dotfiles/herdr/restore.sh"
description = "restore workspace trio"

# alt+d: toggle the reviewr pane (code review for the agent's diff).
# reviewr is a herdr plugin (`herdr plugin install persiyanov/herdr-reviewr`),
# not a local script — the whole pane is the plugin's. Splits to the right of
# the focused pane; `s` in it sends line comments to this workspace's agent.
# Config (theme/auto_open) is machine-local: ~/.config/herdr/plugins/config/
# persiyanov.reviewr/config.toml — see nvim/WORKFLOW.md § "Code review".
[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true
