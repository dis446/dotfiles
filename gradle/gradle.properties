# Gradle user-level config (read by every gradle/gradlew invocation).
#
# Cap Gradle's parallel workers. org.gradle.workers.max defaults to the CPU
# count (16 on the current box, 28 on the incoming one), so four concurrent
# feature masters would each fan out to the full core count and run 64+ workers
# against one machine. 4 each keeps the machine-wide total near the core count.
org.gradle.workers.max=4

# Deliberately NOT setting org.gradle.jvmargs here:
#   - overriding it replaces Gradle's own defaults (including file.encoding),
#     which is a well-known way to break builds in confusing ways
#   - the daemon heap is already bounded by JAVA_TOOL_OPTIONS in
#     ~/dotfiles/fedora/bashrc, and the daemon inherits that environment
#
# Note: a Gradle daemon that is already running keeps the settings it started
# with. After changing this file, run `./gradlew --stop` to pick it up.
