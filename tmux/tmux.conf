# ── Tmux Configuration ────────────────────────────────
# Prefix: Ctrl+b
# Reload: Ctrl+b r
# Session picker: Ctrl+b s

set -g prefix C-b
unbind C-b
bind C-b send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ── Session management ───────────────────────────────
# Text-filterable session switcher (like IntelliJ recent projects)
bind s choose-tree -s

# New named session
bind S command-prompt -p "Session name:" "new-session -d -s '%%' -c '#{pane_current_path}'; switch-client -t '%%'"

# Rename current session
bind $ command-prompt -I "#S" "rename-session -- '%%'"

# Cycle sessions
bind ( switch-client -p
bind ) switch-client -n

# Kill session (keep window, don't kill tmux server)
bind X kill-session

# ── Windows instead of tabs ──────────────────────────
# Each session = one project = one window
unbind c
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind w choose-tree -w

# ── Mouse & display ──────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g set-clipboard on

# ── Status bar (minimal) ─────────────────────────────
set -g status-interval 5
set -g status-left-length 30
set -g status-left "#[fg=blue,bold] #S #[default]"
set -g status-right "#[fg=green] #(whoami) #[fg=yellow]%H:%M #[default]"
set -g status-style "bg=#1a1b26"

# Active window / session indicator
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-current-style "fg=#a9b1d6,bg=#24283b,bold"

# ── Display aids ─────────────────────────────────────
set -g display-panes-time 4000
set -g display-time 4000
set -g status-keys vi
set -g mode-keys vi
